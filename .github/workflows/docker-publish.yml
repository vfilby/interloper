# Publishes the hub image to ghcr.io/vfilby/interpose-hub on every push to main that touches the hub's sources:
# `latest` and `sha-<commit>`, for linux/amd64 and linux/arm64. The Warpgate adapter stays host-built from a checked
# binary (adapters/warpgate/README.md). Main only takes pull requests that passed CI, so this does not re-run tests.
name: Publish hub image

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - internal/**
      - broker/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hub:
    name: Hub image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vfilby/interpose-hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: broker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
