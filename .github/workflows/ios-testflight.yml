# Builds the Interpose iOS app and uploads it to TestFlight. Modelled on MigraLog's release pipeline
# (vfilby/migralog .github/workflows/release-pipeline.yml). One-time setup: docs/runbooks/testflight.md.
#
# Version: tags ios/v<major>.<minor>.<patch>. Each run takes the newest tag, bumps the patch, builds that version with
# build number = patch, uploads, and pushes the new tag. The internal TestFlight group distributes it automatically.
name: "[iOS] TestFlight"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: write # push the ios/v* tag

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      XCODE: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE" && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Version
        id: version
        run: |
          last=$(git tag --list 'ios/v*' | sed 's|^ios/v||' | sort -V | tail -1)
          last=${last:-0.1.0}
          IFS=. read -r major minor patch <<<"$last"
          next="$major.$minor.$((patch + 1))"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "build=$((patch + 1))" >> "$GITHUB_OUTPUT"
          echo "Building $next (build $((patch + 1))), previous ios/v$last"

      - name: Unit tests (ApproverKit)
        working-directory: ios/ApproverKit
        run: swift test

      - name: Signing certificate and profile
        env:
          CERT_P12: ${{ secrets.SWIFT_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.SWIFT_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.INTERLOPER_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "installed profile $uuid"

      - name: App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_TEAM_ID" ] || { echo "the APPLE_TEAM_ID secret is not set"; exit 1; }
          xcodegen generate
          xcodebuild archive -project Approver.xcodeproj -scheme Approver -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Interpose.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"

      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          plutil -replace teamID -string "$APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Interpose.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Tag
        run: |
          tag="ios/v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          echo "### Uploaded $tag to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.private_keys" "$RUNNER_TEMP/profile.mobileprovision"
