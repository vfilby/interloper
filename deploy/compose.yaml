# /opt/warpgate-approver on bastion. Its own compose project: restarting it never touches Warpgate.
# Settings are in broker.env (yours; install.sh never overwrites it). Secrets are files owned by 65532 (the
# container user), mode 0400, mounted read-only.
name: warpgate-approver

services:
  broker:
    build: .
    image: warpgate-approver-broker:local
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    env_file: [broker.env]
    volumes:
      - ./data:/data
      - ./secrets/warpgate-token:/run/secrets/warpgate-token:ro
      - ./secrets/pushover-token:/run/secrets/pushover-token:ro
      - ./secrets/pushover-user:/run/secrets/pushover-user:ro
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
