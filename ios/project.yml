# XcodeGen spec: `xcodegen generate` writes Approver.xcodeproj (not committed).
# The app is "Interloper" (com.eff3.interloper) on the eff3 team; the Xcode target keeps its working name, Approver.
name: Approver
options:
  bundleIdPrefix: com.eff3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ApproverKit:
    path: ApproverKit
targets:
  Approver:
    type: application
    platform: iOS
    sources: [Approver]
    dependencies:
      - package: ApproverKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eff3.interloper
        DEVELOPMENT_TEAM: "ABCDE12345"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Overridden by the release pipeline (docs/runbooks/testflight.md).
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # As MigraLog: the App Store Connect API key cannot do cloud signing, so Release signs manually with the
        # team's Apple Distribution certificate and an App Store profile for this bundle id.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Interloper App Store"
    info:
      path: Approver/Info.plist
      properties:
        CFBundleDisplayName: Interloper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID unlocks the key that signs your approvals.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: The app talks to your Interloper server on the local network.
        NSCameraUsageDescription: The camera scans the enrollment QR code from your Interloper server.
        # Only Apple's own encryption (CryptoKit, Security), which needs no export documentation (runbook).
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.eff3.interloper.enroll
            CFBundleURLSchemes: [wga]
  ApproverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ApproverUITests]
    dependencies:
      - target: Approver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eff3.interloper.uitests
        DEVELOPMENT_TEAM: "ABCDE12345"
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Approver
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Approver:
    build:
      targets:
        Approver: all
        ApproverUITests: [test]
    test:
      targets: [ApproverUITests]
